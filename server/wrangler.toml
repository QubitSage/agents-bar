name = "agents-bar-billing"
main = "worker.mjs"
compatibility_date = "2026-10-26"
workers_dev = true

[vars]
PUBLIC_URL = "https://CONFIGURE-SEU-DOMINIO"
STRIPE_PRICE_ID = "CONFIGURE_PRECO_USD_2_MENSAL"

[[d1_databases]]
binding = "DB"
database_name = "agents-bar"
database_id = "CONFIGURE-D1-ID"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
